version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot_db
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: opspilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_password@postgres:5432/opspilot_db
      - OPS_DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_password@postgres:5432/opspilot_db
      - ENVIRONMENT=production
      - SECRET_KEY=opspilot_super_secret_enterprise_jwt_key_32chars
      - OPSPILOT_APPROVAL_SECRET=opspilot_trusted_approval_boundary_secret_key_32chars
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
